<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>청·백운반 출석부</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#7fa0d4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="청백운반 출석부">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    (function() {
      const saved = localStorage.getItem('appTheme');
      if (saved) { document.documentElement.setAttribute('data-theme', saved); }
      else { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</head>
<body>

  <div id="toast-container"></div>

  <!-- PC 사이드바 (960px 이상에서만 표시) -->
  <nav class="pc-sidebar" id="pcSidebar">
    <div class="pc-sidebar-brand">
      <div class="pc-sidebar-brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
        </svg>
      </div>
      <div>
        <div class="pc-sidebar-brand-text">청·백운반 출석부</div>
        <div class="pc-sidebar-brand-sub">강북고등학교</div>
      </div>
    </div>
    <div class="pc-nav-list" id="pcNavList">
      <div class="pc-nav-indicator" id="pcNavIndicator"></div>
      <button class="pc-nav-item nav-tab active" id="pcTab-home" data-tab="home" onclick="switchTab('home')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
        출석체크
      </button>
      <button class="pc-nav-item nav-tab" id="pcTab-roster" data-tab="roster" onclick="switchTab('roster')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        명단
      </button>
      <button class="pc-nav-item nav-tab" id="pcTab-stats" data-tab="stats" onclick="switchTab('stats')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        통계
      </button>
      <button class="pc-nav-item nav-tab" id="pcTab-schedule" data-tab="schedule" onclick="switchTab('schedule')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        시간표
      </button>
      <button class="pc-nav-item nav-tab" id="pcTab-dashboard" data-tab="dashboard" onclick="switchTab('dashboard')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        대시보드
      </button>
    </div>
    <div class="pc-sidebar-spacer"></div>
    <div class="pc-sidebar-footer" id="pcSidebarFooter">
      <button class="pc-nav-item js-install-btn" onclick="openInstallGuideSheet()" aria-label="앱으로 설치">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 8v6"/><path d="M9.5 11.5 12 14l2.5-2.5"/></svg>
        앱으로 설치
      </button>
      <button class="pc-nav-item js-refresh-btn" onclick="location.reload()" aria-label="새로고침" style="display:none;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        새로고침
      </button>
      <button class="pc-nav-item js-bell-btn" onclick="openActivityLogSheet()" aria-label="활동 로그" style="position:relative;display:none;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        활동 로그
        <span class="bell-dot" style="top:9px; right:14px;"></span>
      </button>
      <button class="pc-nav-item js-teacher-btn" onclick="handleTeacherMenuClick()" aria-label="교사 메뉴">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        교사 메뉴
      </button>
      <button class="pc-nav-item js-theme-btn" onclick="toggleTheme(event)" aria-label="테마 전환">
        <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;transition:opacity .3s,transform .4s var(--spring);">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
          <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
          <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;transition:opacity .3s,transform .4s var(--spring);">
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
        </svg>
        <span style="margin-left:28px;">테마 전환</span>
      </button>
    </div>
  </nav>

  <!-- 스플래시 -->
  <div id="appSplash">
    <div class="splash-icon-wrap">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
        <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
      </svg>
    </div>
    <div class="splash-app-title">청·백운반 출석부</div>
    <div class="splash-app-sub">강북고등학교 · 2026학년도</div>
    <div class="splash-dots">
      <div class="splash-dot"></div><div class="splash-dot"></div><div class="splash-dot"></div>
    </div>
  </div>

  <!-- 헤더 -->
  <div class="app-header">
    <div style="min-width:72px;">
      <button class="back-btn" id="backBtn" onclick="goBack()" aria-label="출석 목록으로">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        목록
      </button>
    </div>
    <div class="header-title" onclick="handleHeaderClick()" style="cursor:default;">청·백운반 자율학습 출석부</div>
    <div class="header-icon-group" style="display:flex;align-items:center;gap:2px;flex-shrink:0;">
    <button class="header-btn js-install-btn" onclick="openInstallGuideSheet()" aria-label="앱으로 설치">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="2" width="12" height="20" rx="2"/>
        <path d="M12 8v6"/><path d="M9.5 11.5 12 14l2.5-2.5"/>
      </svg>
    </button>
    <button class="header-btn js-refresh-btn" onclick="location.reload()" aria-label="새로고침" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    </button>
    <button class="header-btn" id="activityBellBtn" onclick="openActivityLogSheet()" aria-label="활동 로그" style="position:relative;display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </svg>
      <span class="bell-dot"></span>
    </button>
    <button class="header-btn" id="teacherMenuBtn" onclick="handleTeacherMenuClick()" aria-label="교사 메뉴">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="header-btn" id="themeToggleBtn" onclick="toggleTheme(event)" aria-label="테마 전환">
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;transition:opacity .3s,transform .4s var(--spring);">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
        <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
        <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;transition:opacity .3s,transform .4s var(--spring);">
        <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
      </svg>
    </button>
    </div>
  </div>

  <!-- 출석체크 탭 -->
  <div id="view-home" class="tab-view active">
    <div class="filter-section">
      <div class="filter-row">
        <input type="date" id="dateInput" class="cd-input" style="min-width:130px;" onchange="handleDateChange()">
        <select id="groupSelect" class="cd-select" style="min-width:100px;"
          onchange="localStorage.setItem('lastGroup', this.value); loadStudents()"></select>
        <div class="session-pill-wrap" id="sessionPillWrap"></div>
        <input type="text" id="checkerName" class="cd-input" style="min-width:110px;" placeholder="출결 확인자 성명"
          oninput="localStorage.setItem('checkerName', this.value)">
      </div>
      <!-- 방과후 없는 날 토글 — 오후 자율학습 세션에서만 표시 -->
      <div id="afterSchoolRow" style="display:none;justify-content:center;align-items:center;gap:10px;padding-bottom:10px;">
        <button class="cd-sw" id="afterSchoolSw" onclick="toggleAfterSchool()" aria-label="방과후 없는 날">
          <div class="cd-sw-thumb"></div>
        </button>
        <span style="font-size:13px;font-weight:700;color:var(--ink-3);" id="afterSchoolLbl">방과후 없는 날</span>
      </div>
    </div>
    <div class="main-container">
      <div class="dashboard-wrapper">
        <div id="dashboardWidget">
          <div class="dash-item"><span class="dash-num blue" id="dashTotal">0</span><span style="font-size:12px;color:var(--ink-3)">총원</span></div>
          <div class="dash-div"></div>
          <div class="dash-item"><span class="dash-num green" id="dashPresent">0</span><span style="font-size:12px;color:var(--ink-3)">출석</span></div>
          <div class="dash-div"></div>
          <div class="dash-item"><span class="dash-num red" id="dashAbsent">0</span><span style="font-size:12px;color:var(--ink-3)">결석</span></div>
        </div>
      </div>
      <div id="studentContainer" class="student-grid"></div>
    </div>
  </div>

  <!-- 명단 탭 -->
  <div id="view-roster" class="tab-view">
    <div class="view-filter-bar" style="flex-direction:column;align-items:stretch;gap:8px;padding:10px 14px;">
      <div class="roster-pill-wrap" id="rosterPillWrap"></div>
      <div style="position:relative;">
        <input type="text" id="rosterSearchInput" class="cd-input" placeholder="학생 이름 검색" style="width:100%;box-sizing:border-box;padding-right:32px;" oninput="filterRosterByName(this.value)">
        <span class="clear-input-btn" id="rosterSearchClear" onclick="_clearSearchInput('rosterSearchInput','rosterSearchClear',filterRosterByName)" role="button" tabindex="0" aria-label="검색어 지우기" style="display:none;">&times;</span>
      </div>
    </div>
    <div class="main-container" id="rosterContainer">
      <div class="text-center py-5" style="color:var(--ink-3);font-weight:600;">명단을 불러오는 중...</div>
    </div>
  </div>

  <!-- 통계 탭 -->
  <div id="view-stats" class="tab-view">
    <div class="view-filter-bar" style="flex-direction:column;align-items:stretch;gap:8px;">
      <div style="display:flex;gap:8px;">
        <select id="filterStudyGroup" class="cd-select" style="flex:1;" onchange="filterStats()"></select>
        <select id="filterClass"      class="cd-select" style="flex:1;" onchange="filterStats()"></select>
      </div>
      <div style="position:relative;">
        <input type="text" id="statsSearchInput" class="cd-input" placeholder="학생 이름 검색" style="width:100%;box-sizing:border-box;padding-right:32px;" oninput="filterStatsByName(this.value)">
        <span class="clear-input-btn" id="statsSearchClear" onclick="_clearSearchInput('statsSearchInput','statsSearchClear',filterStatsByName)" role="button" tabindex="0" aria-label="검색어 지우기" style="display:none;">&times;</span>
      </div>
    </div>
    <div class="container py-4">
      <div class="top3-card">
        <div style="font-size:12px;font-weight:700;letter-spacing:0.5px;color:var(--amber);margin-bottom:10px;">🏆 <span id="top3SemesterLabel">1학년 1학기</span> 청·백운반 누적 자습 시간 Top 3</div>
        <div id="top3Container" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        누적 자율학습 통계
      </div>
      <div class="sch-sess-filter">
        <div class="ssf-chips" id="statsSortChips"></div>
        <button class="cd-sw" id="statsFlatSw" onclick="toggleStatsFlatView()" aria-label="자습반 구분 없이 전체 순위로 보기">
          <div class="cd-sw-thumb"></div>
        </button>
        <span style="font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap;">전체 순위</span>
      </div>
      <div id="statsListContainer"></div>
    </div>
  </div>

  <!-- 시간표 탭 -->
  <div id="view-schedule" class="tab-view">
    <div class="view-filter-bar" style="flex-direction:column;align-items:stretch;gap:8px;">
      <div style="display:flex;gap:8px;align-items:center;">
        <select id="scheduleGroupSelect" class="cd-select" style="flex:1;" onchange="updateGroupScheduleView()"></select>
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">
          <button id="schedEditBtn" onclick="toggleScheduleEditMode()" style="padding:8px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--bg-deep);background:var(--surface);color:var(--ink-3);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:var(--sh-xs);transition:all .2s;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            편집
          </button>
          <button class="cd-btn cd-btn-primary" onclick="window.print()" style="padding:8px 16px;font-size:13px;border-radius:var(--radius-sm);">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            인쇄
          </button>
        </div>
      </div>
      <div style="position:relative;">
        <input type="text" id="schSearchInput" class="cd-input" placeholder="학생 이름 검색" style="width:100%;box-sizing:border-box;padding-right:32px;" oninput="filterSchByName(this.value)">
        <span class="clear-input-btn" id="schSearchClear" onclick="_clearSearchInput('schSearchInput','schSearchClear',filterSchByName)" role="button" tabindex="0" aria-label="검색어 지우기" style="display:none;">&times;</span>
      </div>
    </div>
    <div class="container py-4">
      <div id="schTitle" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        주간 자습 편성표
      </div>
      <div class="sch-pill-wrap">
        <div class="sch-pill-bar">
          <div class="sch-pill-indicator" id="schPillIndicator"></div>
          <div class="sch-pill-item active" id="schTab-all" onclick="switchSchTab('all')">전체</div>
          <div class="sch-pill-item"        id="schTab-day" onclick="switchSchTab('day')">요일별</div>
        </div>
      </div>
      <div id="schView-all">
        <div id="scheduleCardList" class="sch-card-list">
          <div class="text-center py-5" style="color:var(--ink-3);font-weight:600;">자습반을 선택하세요.</div>
        </div>
      </div>
      <div id="schView-day" style="display:none;">
        <div class="sch-day-tabs" id="schDayTabs">
          <div class="sch-day-tab active" onclick="switchSchDay(0)">월</div>
          <div class="sch-day-tab"        onclick="switchSchDay(1)">화</div>
          <div class="sch-day-tab"        onclick="switchSchDay(2)">수</div>
          <div class="sch-day-tab"        onclick="switchSchDay(3)">목</div>
          <div class="sch-day-tab"        onclick="switchSchDay(4)">금</div>
          <div class="sch-day-tab"        onclick="switchSchDay(5)">토</div>
        </div>
        <div class="sch-sess-filter">
          <div class="ssf-chips" id="schSessChips"></div>
          <button class="ssf-reset" id="schSessReset" onclick="resetSchSessFilter()" title="필터 초기화">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
        <div class="sch-day-card" id="schDayContent"></div>
      </div>
    </div>
  </div>

  <!-- 대시보드 탭 (교사 전용 — 진입 시 비밀번호 확인) -->
  <div id="view-dashboard" class="tab-view">
    <div class="view-filter-bar" style="flex-direction:column;align-items:stretch;gap:8px;">
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="ssf-reset" onclick="_dashShiftDate(-1)" aria-label="이전 날짜">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <input type="date" id="dashDateInput" class="cd-input" style="flex:1;" onchange="loadDashboard()">
        <button class="ssf-reset" onclick="_dashShiftDate(1)" aria-label="다음 날짜">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="ssf-reset" onclick="loadDashboard()" aria-label="새로고침">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button class="ssf-reset" onclick="openPeriodSummarySheet()" aria-label="기간 결산">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
        </button>
      </div>
      <div class="sch-pill-wrap" style="padding:0;">
        <div class="sch-pill-bar" id="dashModeBar">
          <div class="sch-pill-indicator" id="dashModeIndicator"></div>
          <div class="sch-pill-item active" id="dashMode-absent" onclick="_switchDashMode('absent')">결석자만</div>
          <div class="sch-pill-item" id="dashMode-all" onclick="_switchDashMode('all')">전체 명단</div>
        </div>
      </div>
      <div class="ssf-chips" id="dashSessChips"></div>
      <div id="dashLights"></div>
    </div>
    <div class="container py-4">
      <div id="dashSummary" style="margin-bottom:18px;"></div>
      <div id="dashAbsentList"></div>
    </div>
  </div>

  <!-- 규정 위반 등록 FAB (명단 탭에서만 표시) -->
  <button class="roster-fab" id="rosterFab" onclick="openViolFabSheet()" aria-label="규정 위반 등록">
    <div class="roster-fab-tip">규정 위반 등록</div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
  </button>

  <!-- 액션바 (출석체크 탭) -->
  <div class="action-bar-wrapper" id="homeActionBar">
    <button class="btn-action-sub" onclick="viewAllResults()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
        <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
      </svg>
      결과보기
    </button>
    <button id="btnSave" class="btn-action-main" data-save-state="idle" onclick="submitAttendance()">
      <div class="rsb-bar" id="saveBtnBar"></div>
      <div class="rsb-label" id="saveBtnLabel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
        </svg>
        <span id="saveBtnText">출석 저장</span>
      </div>
    </button>
  </div>

  <!-- 잠금 알림 칩 -->
  <div id="lockChip">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>저장 잠금 상태 — 해제 후 수정하세요</span>
  </div>

  <!-- 오프라인 저장 대기 칩 -->
  <div id="offlineQueueChip" onclick="_flushOfflineQueue(true)">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    <span id="offlineQueueChipText">오프라인 저장 대기 중 · 탭하여 재시도</span>
  </div>

  <!-- 하단 탭바 (4탭) -->
  <div class="bottom-tab-bar-wrap">
    <div class="bottom-tab-bar">
      <div class="tab-indicator-fluid" id="tabIndicatorFluid"></div>
      <div class="tab-item nav-tab active" id="tab-home"     data-tab="home"     onclick="switchTab('home')">출석체크</div>
      <div class="tab-item nav-tab" id="tab-roster"   data-tab="roster"   onclick="switchTab('roster')">명단</div>
      <div class="tab-item nav-tab" id="tab-stats"    data-tab="stats"    onclick="switchTab('stats')">통계</div>
      <div class="tab-item nav-tab" id="tab-schedule" data-tab="schedule" onclick="switchTab('schedule')">시간표</div>
      <div class="tab-item nav-tab" id="tab-dashboard" data-tab="dashboard" onclick="switchTab('dashboard')">대시보드</div>
    </div>
  </div>


  <script src="js/config.js?v=20260720d"></script>
  <script src="js/api.js?v=20260820e"></script>
  <!-- app.js가 기능별 파일로 분리됨(2026-08-19) — 전부 모듈 아닌 일반
       스크립트라 예전처럼 하나의 전역 스코프를 공유한다. init.js는 반드시
       맨 마지막에 로드해야 함(window.onload에서 다른 파일의 함수를 씀). -->
  <script src="js/core.js?v=20260820j"></script>
  <script src="js/pwa.js?v=20260819a"></script>
  <script src="js/attendance.js?v=20260820b"></script>
  <script src="js/stats.js?v=20260820b"></script>
  <script src="js/schedule.js?v=20260819a"></script>
  <script src="js/roster.js?v=20260819a"></script>
  <script src="js/dashboard.js?v=20260820e"></script>
  <script src="js/violations.js?v=20260819a"></script>
  <script src="js/teacher-menu.js?v=20260820f"></script>
  <script src="js/init.js?v=20260820c"></script>

</body>
</html>
